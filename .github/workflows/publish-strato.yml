name: Publicera Bubbsun till Strato

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Bygg och publicera endast Bubbsun
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Installera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installera beroenden
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Bygg Bubbsun live och beta
        run: pnpm run build:all

      - name: Installera SFTP-verktyget
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Ladda endast upp Bubbsun till Strato
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.STRATO_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          lftp <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          set cmd:fail-exit yes
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT
          # Yatsun, Loppis/Kassun och RK Kassa har egna publiceringsflöden.
          # Bubbsuns publicering får aldrig skriva till deras servermappar.
          mirror --reverse --ignore-time --no-perms --parallel=4 \
            --exclude-glob yatsun/** \
            --exclude-glob loppis/** \
            --exclude-glob rk/** \
            dist/ public/
          # Routning och Bubbsuns båda startsidor ersätts alltid.
          put -O public dist/.htaccess
          put -O public dist/index.html
          put -O public/beta dist/beta/index.html
          cls -l public/index.html public/beta/index.html public/.htaccess
          cat public/.htaccess
          bye
          EOF
