name: Publish Yatsun only
on:
  workflow_dispatch:
  push:
    branches: [codex/bubbsun-current-release]
    paths: [.github/workflows/publish-yatsun.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test-only
          MARIADB_DATABASE: yatsun_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
      - name: Test Yatsun before uploading
        env:
          YATSUN_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=yatsun_test;charset=utf8mb4
        run: |
          php -l public/yatsun/api/social.php
          php tests/yatsun-rooms.test.php
          node --check public/yatsun/social.mjs
          node --check public/yatsun/app.js
          node --check public/yatsun/dice-view.mjs
          node --check public/yatsun/dice-worker.mjs
          node --test tests/yatsun-dice-resting.test.mjs
          node --test tests/yatsun-progression.test.mjs
          node --test tests/yatsun-online-view.test.mjs
      - run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Upload only the changed Yatsun files
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.STRATO_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          lftp <<EOF
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 1
          set cmd:fail-exit yes
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT
          put public/yatsun/api/social.php -o public/yatsun/api/social.php
          put public/yatsun/api/index.php -o public/yatsun/api/index.php
          put public/yatsun/social.mjs -o public/yatsun/social.mjs
          put public/yatsun/progression.mjs -o public/yatsun/progression.mjs
          put public/yatsun/progression.css -o public/yatsun/progression.css
          put public/yatsun/styles.css -o public/yatsun/styles.css
          put public/yatsun/assets/dice-materials.png -o public/yatsun/assets/dice-materials.png
          mkdir -p public/yatsun/vendor
          put public/yatsun/vendor/rapier.mjs -o public/yatsun/vendor/rapier.mjs
          put public/yatsun/vendor/rapier.LICENSE -o public/yatsun/vendor/rapier.LICENSE
          put public/yatsun/dice-math.mjs -o public/yatsun/dice-math.mjs
          put public/yatsun/dice-physics.mjs -o public/yatsun/dice-physics.mjs
          put public/yatsun/dice-worker.mjs -o public/yatsun/dice-worker.mjs
          put public/yatsun/dice-view.mjs -o public/yatsun/dice-view.mjs
          put public/yatsun/app.js -o public/yatsun/app.js
          put public/yatsun/index.html -o public/yatsun/index.html
          bye
          EOF
