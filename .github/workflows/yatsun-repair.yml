name: Yatsun isolated database repair
on:
  workflow_dispatch:
  push:
    branches: [codex/bubbsun-current-release]
    paths: [.github/workflows/yatsun-repair.yml, scripts/yatsun-db-probe.php]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y lftp
      - name: Prepare temporary protected probe
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "PROBE_TOKEN=$token" >> "$GITHUB_ENV"
          export TOKEN="$token"
          node -e 'const fs=require("fs");fs.writeFileSync("/tmp/yatsun-probe.php",fs.readFileSync("scripts/yatsun-db-probe.php","utf8").replace("__PROBE_TOKEN__",process.env.TOKEN))'
      - name: Check only Yatsun database
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.STRATO_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          lftp <<EOF
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 1
          set cmd:fail-exit yes
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT
          get public/yatsun/api/yatsun-db.json -o /tmp/yatsun-db-before.json
          bye
          EOF
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("/tmp/yatsun-db-before.json","utf8"));if(c.name!=="dbs16080702"||c.user!=="dbu4703673")throw Error("Unexpected database target; stopping");c.host="database-5021326777.webspace-host.com";fs.writeFileSync("/tmp/yatsun-db-fixed.json",JSON.stringify(c),{mode:0o600})'
          lftp <<EOF
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 1
          set cmd:fail-exit yes
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT
          put /tmp/yatsun-db-fixed.json -o public/yatsun/api/yatsun-db.json
          put /tmp/yatsun-probe.php -o public/yatsun/api/_codex-db-probe.php
          bye
          EOF
          curl --fail --silent --show-error --max-time 30 -H "X-Yatsun-Probe: $PROBE_TOKEN" https://www.bubbsun.se/yatsun/api/_codex-db-probe.php > /tmp/probe-result.json
          cat /tmp/probe-result.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/probe-result.json"));if(!r.connected||!r.expectedDatabase||!r.socialSchemaReady)process.exit(1)'
      - name: Remove temporary probe
        if: always()
        env:
          SFTP_HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.STRATO_SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.STRATO_SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
        run: |
          lftp <<EOF
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 1
          set cmd:fail-exit yes
          open -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://$SFTP_HOST:$SFTP_PORT
          rm -f public/yatsun/api/_codex-db-probe.php
          bye
          EOF
