<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Yatsun – mobiltest på datorn</title>
    <style>
      :root{font-family:Inter,"Segoe UI",sans-serif;color:#f9f0d5;background:#17231d}
      *{box-sizing:border-box}
      body{margin:0;min-width:760px;background:radial-gradient(circle at 50% 0,#315f49 0,transparent 42%),#17231d}
      header{position:sticky;z-index:2;top:0;display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:9px 18px;background:#102019e8;border-bottom:1px solid #d9bd715c;backdrop-filter:blur(12px)}
      header strong{margin-right:14px;font-size:14px}
      button,a{padding:9px 13px;border:1px solid #d6bd79;border-radius:999px;background:#315f49;color:#fff6d9;font:inherit;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer}
      button.active{background:#f7e6af;color:#173d2d}
      main{display:flex;justify-content:center;padding:22px 22px 50px}
      .phone{padding:12px;border:2px solid #c9ab65;border-radius:34px;background:#0d1511;box-shadow:0 25px 70px #0009}
      iframe{display:block;width:390px;height:844px;border:0;border-radius:23px;background:#f5efd9}
      .hint{position:fixed;right:18px;bottom:16px;max-width:230px;margin:0;color:#cfdbcf;font-size:11px;line-height:1.45}
    </style>
  </head>
  <body>
    <header>
      <strong>Yatsun mobiltest</strong>
      <button type="button" data-width="360">Liten · 360</button>
      <button type="button" class="active" data-width="390">Normal · 390</button>
      <button type="button" data-width="430">Stor · 430</button>
      <a href="./" target="_blank" rel="noreferrer">Öppna vanligt ↗</a>
    </header>
    <main><div class="phone"><iframe title="Yatsun i mobilstorlek" src="./?desktop-mobile-preview=1"></iframe></div></main>
    <p class="hint">Klicka och spela direkt i ramen. Den använder samma sparade speldata och samma version som den riktiga sidan.</p>
    <script>
      const frame=document.querySelector('iframe');
      document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
        frame.style.width=`${button.dataset.width}px`;
        document.querySelectorAll('[data-width]').forEach(item=>item.classList.toggle('active',item===button));
      }));
    </script>
  </body>
</html>
